[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mfd-pair"
version = "0.1.0"
description = "Interaction-aware tabular retrieval with marginal and pair information"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5"]

[project.scripts]
mfd-pair = "mfd_pair.__main__:main"

[tool.setuptools.packages.find]
include = ["mfd_pair*"]
